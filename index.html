<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link rel="stylesheet" href="Styles.css">


</head>

<nav>

</nav>

<body>

<header>
    <div class="container">
        <h1><i class="fas fa-warehouse"></i> WareHouse Inventory</h1>
        <a href = "mailto:Dwaynewisdom5@gmail.com?subject=Stock%20Reoder%20.&body=Ordering%20[Insert%20Item]%20[Quantity]%20to%20[Insert%20Branch%20Location]" target="_blank" class="order">Order Product</a>
        <div class="stats">
            <span id="lastUpdated">Last updated: Just now</span>
        </div>
    </div>
</header>


    <main class="container">

        <section class="summary-cards">
            <div class="card">
                <div class="card-icon">
                    <i class="fas fa-cubes"></i>
                </div>
                <div class="card-info">
                    <h3 id="totalProducts">0</h3>
                    <p>Total Products</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon">
                    <i class="fas fa-dollar-sign"></i>
                </div>
                <div class="card-info">
                    <h3 id="totalValue">$0.00</h3>
                    <p>Total Value</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon">
                    <i class="fas fa-layer-group"></i>
                </div>
                <div class="card-info">
                    <h3 id="totalQuantity">0</h3>
                    <p>Total Rolls/Quantity</p>
                </div>
            </div>
        </section>

    
        <section class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search products...">
                <i class="fas fa-search"></i>
            </div>
            <div class="filters">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                
                </select>
                <button id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </section>

    
        <section class="inventory-table">
            <table id="productsTable">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Supplier</th>
                        <th>Status</th>
                        <th>Date Added</th>
                    </tr>

                </thead>
                <tbody id="tableBody">
                
                </tbody>
            </table>
        </section>
    </main>


    <div id="loading" class="loading">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Loading inventory...</p>
    </div>

    <script src="Script.js"></script>

</body>
</html>
